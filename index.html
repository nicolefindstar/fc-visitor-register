<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FC visitor register</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* WFP Design System tokens. Colour has one meaning each: blue = an action, green = served or done,
   red = not served or an error, yellow = needs attention, grey = paused. */
:root{--fg:#000000e9;--fg-2:#000000ab;--fg-muted:#0000008d;--border:#0000001c;--muted:#f8f8f8;--muted-2:#f1f1f1;
  --primary:#0078b8;--primary-50:#f4f9fc;--primary-100:#e9f2fa;--primary-300:#aed1ec;--primary-700:#005795;
  --danger:#e4052c;--danger-50:#fff7f6;--danger-400:#ff8f89;--danger-700:#ad000c;
  --warning-50:#fff8e7;--warning-400:#dea600;--warning-700:#7d4800;
  --success:#008442;--success-50:#f5faf6;--success-100:#e8f4eb;--success-400:#7abe8a;
  --font:"Open Sans","Noto Sans",Roboto,ui-sans-serif,system-ui,sans-serif;--font-ur:"Noto Naskh Arabic","Noto Nastaliq Urdu",serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff}
body{font-family:var(--font);color:var(--fg);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary-300);outline-offset:2px}

.app{max-width:760px;height:100%;margin:0 auto;display:flex;flex-direction:column;font-size:18px;line-height:1.4;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.app[dir="rtl"]{font-family:var(--font-ur);line-height:1.7}
.app[dir="rtl"] .ltr{direction:ltr;unicode-bidi:isolate}
svg.i{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app[dir="rtl"] svg.flip{transform:scaleX(-1)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);min-height:68px}
.topbar .who{flex:1;min-width:0}
.topbar .fc{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .date{font-size:14px;color:var(--fg-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2);border:1px solid var(--border);border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--warning-400)}
.chip.ok .dot{background:var(--success)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:48px;height:48px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:15px;font-weight:600}
.savefail{background:var(--danger-50);border-bottom:1px solid var(--danger-400);color:var(--danger-700);padding:10px 16px;font-size:15px;font-weight:600}
.main{flex:1;overflow:auto;padding:20px 20px 24px;display:flex;flex-direction:column;gap:16px}
.counts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.counts div{padding:10px 4px}
.counts div + div{padding-inline-start:20px;border-inline-start:1px solid var(--border)}
.counts b{display:block;font-size:36px;line-height:1.1;font-weight:700}
.counts span{font-size:15px;color:var(--fg-2)}
.big{display:flex;align-items:center;gap:16px;width:100%;border:2px solid var(--primary);border-radius:6px;padding:16px 20px;text-align:start;min-height:104px}
.big svg.i{width:40px;height:40px}
.big strong{display:block;font-size:26px;line-height:1.2}
.big small{display:block;font-size:15px;font-weight:400;margin-top:2px}
.big.arrive{background:var(--primary);color:#fff}
.big.leave{background:#fff;color:var(--primary-700)}
.big.arrive:active{background:var(--primary-700)}
.big.leave:active{background:var(--primary-50)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .big{min-height:72px;padding:12px 16px;gap:12px}
.row2 .big svg.i{width:32px;height:32px}
.row2 .big strong{font-size:22px}
.homehint{font-size:15px;color:var(--fg-2);margin:0}
.foot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border)}
.foot .iconbtn{flex:1;height:56px;font-size:16px}
h2.q{font-size:26px;line-height:1.3;margin:4px 0 0;font-weight:700}
.app[dir="rtl"] h2.q{line-height:1.6}
.hint{font-size:16px;color:var(--fg-2);margin:0}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px;border:1px solid #cccccc;border-radius:6px;background:#fff;text-align:start;font-size:18px;font-weight:600}
.opt svg.i{color:var(--primary)}
.opt:active{background:var(--primary-50)}
.opt.yes{background:var(--success);border-color:var(--success);color:#fff}
.opt.no{background:var(--danger);border-color:var(--danger);color:#fff}
.opt.yes svg.i,.opt.no svg.i{color:#fff}
.opt.yes,.opt.no,.opt.later{min-height:80px;font-size:21px}
.opt.later{background:var(--muted-2)}
.opt.later svg.i{color:var(--fg-2)}
.grp{font-size:15px;font-weight:600;color:var(--fg-2);margin:6px 0 -4px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;min-height:48px;font-size:16px;color:var(--primary);font-weight:600}
.back svg.i{width:22px;height:22px}
.vnum{font-size:20px;color:var(--fg-2)}
.vnum b{font-size:44px;color:var(--primary);margin-inline-start:8px}
.visitline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:16px;color:var(--fg-2);padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.visitline b{color:var(--fg)}
.display{display:flex;align-items:center;justify-content:center;height:84px;border:2px solid var(--primary-300);border-radius:6px;font-size:48px;font-weight:700;background:var(--primary-50)}
.display.err{border-color:var(--danger-400);background:var(--danger-50)}
.match{min-height:28px;font-size:16px;text-align:center;color:var(--fg-2)}
.match.err{color:var(--danger-700)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{height:68px;border:1px solid #cccccc;border-radius:6px;background:#fff;font-size:28px;font-weight:600}
.pad button:active{background:var(--primary-100)}
.pad .ok{background:var(--primary);border-color:var(--primary);color:#fff;font-size:22px}
.pad .ok:disabled{background:var(--muted-2);border-color:var(--border);color:var(--fg-muted)}
.wide{width:100%;min-height:56px;border:1px solid #cccccc;border-radius:6px;background:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.done .tick{width:88px;height:88px;border-radius:50%;background:var(--success-100);color:var(--success);display:flex;align-items:center;justify-content:center}
.done .tick svg.i{width:52px;height:52px;stroke-width:2.4}
.done .label{font-size:20px;color:var(--fg-2)}
.done .num{font-size:120px;line-height:1;font-weight:700;color:var(--primary)}
.done .say{font-size:20px;line-height:1.45;max-width:480px;padding:12px 16px;border:1px solid var(--primary-300);background:var(--primary-50);border-radius:6px}
.done .msg{font-size:28px;font-weight:700}
.app[dir="rtl"] .done .say{line-height:1.9}
.done .sub{font-size:17px;color:var(--fg-2)}
.done .actions{display:flex;gap:12px;width:100%;max-width:480px;margin-top:8px}
.done .actions button{flex:1;height:56px;border-radius:6px;font-size:18px;font-weight:600;border:1px solid #cccccc;background:#fff}
.done .actions .primary{background:var(--primary);border-color:var(--primary);color:#fff}
.timer{width:100%;max-width:480px;height:4px;background:var(--muted-2);border-radius:99px;overflow:hidden}
.timer b{display:block;height:100%;width:100%;background:var(--primary-300);transform-origin:left;animation:shrink 6s linear forwards}
.app[dir="rtl"] .timer b{transform-origin:right}
@keyframes shrink{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.timer b{animation:none}}
.board-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:16px;font-weight:600;margin-top:4px}
.board-h span{font-weight:400;color:var(--fg-2);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;height:88px;border:1px solid #cccccc;border-radius:6px;background:#fff;padding:4px}
.tile b{font-size:30px;line-height:1.1}
.tile span{font-size:13px;color:var(--fg-2)}
.tile.long{background:var(--warning-50);border-color:var(--warning-400)}
.tile.out{border-style:dashed;background:var(--muted)}
.tile:active{background:var(--primary-100)}
.empty{font-size:15px;color:var(--fg-muted);padding:8px 0}
.sumgrid{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--border)}
.sumgrid div{padding:12px 8px 12px 0;border-bottom:1px solid var(--border)}
.sumgrid b{display:block;font-size:28px;line-height:1.15}
.sumgrid span{font-size:14px;color:var(--fg-2)}
.bars{display:grid;gap:6px;font-size:14px}
.bars .r{display:grid;grid-template-columns:56px 1fr 34px;gap:8px;align-items:center}
.bars .t{height:14px;background:var(--muted-2);border-radius:3px;overflow:hidden}
.bars .t b{display:block;height:100%;background:#545454;border-radius:3px}
.bars .r.peak .t b{background:var(--primary)}
.bars .n{text-align:end}
.sec{font-size:17px;font-weight:700;margin:6px 0 0}
.alert{border:1px solid var(--warning-400);background:var(--warning-50);border-radius:6px;padding:12px 16px;font-size:16px}
.alert.ok{border-color:var(--success-400);background:var(--success-50)}
.alert.err{border-color:var(--danger-400);background:var(--danger-50);color:var(--danger-700)}
.btn-main{width:100%;min-height:56px;border:0;border-radius:6px;background:var(--primary);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-line{width:100%;min-height:56px;border:2px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary-700);font-size:18px;font-weight:700}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;gap:12px;align-items:flex-start;font-size:18px}
.list li svg.i{width:26px;height:26px;margin-top:2px}
.list.yes svg.i{color:var(--success)}
.list.no svg.i{color:var(--danger)}
.days{display:grid}
.days .d{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:16px}
.days .d span{flex:1}
.days .d small{display:block;color:var(--fg-2);font-size:14px}
.linkbtn{border:0;background:none;padding:0;min-height:48px;color:var(--primary);font-weight:600;font-size:16px;text-decoration:underline;text-underline-offset:2px}
/* set-up form (supervisor, English only) */
.form{display:grid;gap:16px}
.field label{display:block;font-weight:600;font-size:16px;margin-bottom:4px}
.field small{display:block;color:var(--fg-2);font-size:14px;margin-bottom:6px}
.field input,.field select{width:100%;min-height:52px;padding:8px 12px;border:1px solid #cccccc;border-radius:6px;background:#fff;font-size:18px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-height:52px;border:1px solid #cccccc;border-radius:6px;background:#fff;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--primary-100);border-color:var(--primary-300);color:var(--primary-700);font-weight:700}
.err-t{color:var(--danger-700);font-size:15px;min-height:20px}
</style>
</head>

   '<div><b>'+s.open+'</b><span>'+t('s_open')+'</span></div><div><b>'+(s.medianMs!=null?dur(s.medianMs):'–')+'</b><span>'+t('s_med')+'</span></div><div><b>'+(s.capture!=null?s.capture+'%':'–')+'</b><span>'+t('s_cap')+'</span></div></div>'+
   (c.closed?'<div class="alert ok">'+t('closed_now')+'</div>':s.open?'<div class="alert">'+t('close_warn',{n:s.open})+'</div>':'')+
   (c.shareFail?'<div class="alert err">'+t('share_fail')+'</div>':'')+
   (s.open?'<button class="btn-line" data-act="closeday">'+t('close_btn')+'</button>':'')+
   (S.cfg.upload_url?(uploading?'<div class="alert">…</div>':upErr==='offline'?'<div class="alert">'+t('up_off')+'</div>':upErr?'<div class="alert err">'+t('up_err',{e:esc(upErr)})+'</div>':
       !pendingN?'<div class="alert ok">'+t('up_done',{t:S.lastUpload?C.hhmm(S.lastUpload):''})+'</div>':'')+
     (pendingN?'<button class="btn-main" data-act="upnow">'+t('up_now')+' ('+pendingN+')</button>':''):'')+
   sendBtn(S.day,t('send'),!S.cfg.upload_url&&(!s.open||c.closed))+'<p class="hint">'+t('send_h')+(sentAt?' '+t('sent',{t:C.hhmm(sentAt)}):'')+'</p>'+
   '<div class="sec">'+t('by_hour')+'</div>'+(hs.length?'<div class="bars">'+hs.map(function(h){return '<div class="r'+(h===peak?' peak':'')+'"><span class="ltr">'+C.pad2(h)+':00</span><div class="t"><b style="width:'+(s.hours[h]/mx*100)+'%"></b></div><span class="n">'+s.hours[h]+'</span></div>';}).join('')+'</div>':'<div class="empty">'+t('none_yet')+'</div>')+
   '<div class="sec">'+t('top_r')+'</div>'+(rs.length?'<div class="bars">'+rs.map(function(k){return '<div class="r" style="grid-template-columns:1fr 120px 34px"><span>'+t('r_'+k)+'</span><div class="t"><b style="width:'+(s.reasons[k]/rmx*100)+'%"></b></div><span class="n">'+s.reasons[k]+'</span></div>';}).join('')+'</div>':'<div class="empty">'+t('none_yet')+'</div>')+
   (days.length?'<div class="sec">'+t('earlier')+'</div><div class="days">'+days.map(function(d){var a=S.archive[d],st=S.sentAt&&S.sentAt[d];
     return '<div class="d"><span class="ltr">'+d+'<small>'+t('visits_n',{n:a.visits.length})+', '+(st?t('sent',{t:C.hhmm(st)}):t('not_sent'))+'</small></span><button class="iconbtn" data-act="send" data-v="'+d+'">'+t('send_again')+'</button></div>';}).join('')+'</div>':'')+
   '<button class="linkbtn" data-act="settings">'+t('settings')+'</button></main>';
 },
 help:function(){
  return topbar()+'<main class="main">'+backBtn()+'<h2 class="q">'+t('who_t')+'</h2><p class="hint" style="font-size:18px;color:var(--fg)">'+t('who_tip')+'</p>'+
   '<div class="sec">'+t('who_yes')+'</div><ul class="list yes">'+['y1','y2','y3'].map(function(k){return '<li>'+ic('check')+'<span>'+t(k)+'</span></li>';}).join('')+'</ul>'+
   '<div class="sec">'+t('who_no')+'</div><ul class="list no">'+['n1','n2','n3','n4'].map(function(k){return '<li>'+ic('x')+'<span>'+t(k)+'</span></li>';}).join('')+'</ul></main>';
 }
};
function padKeys(okOn){
  return '<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(d){return '<button data-act="key" data-v="'+d+'">'+d+'</button>';}).join('')+
   '<button data-act="key" data-v="del" aria-label="Delete">'+ic('del')+'</button><button data-act="key" data-v="0">0</button>'+
   '<button class="ok" data-act="padok"'+(okOn?'':' disabled')+'>'+t('ok')+'</button></div>';
}

function render(){
  var app=document.getElementById('app');
  if(!S.cfg)ui.screen='setup';
  app.setAttribute('dir',lang()==='ur'&&ui.screen!=='setup'?'rtl':'ltr');app.setAttribute('lang',lang()==='ur'?'ur':'en-GB');
  app.innerHTML=screens[ui.screen]();
  var f=document.getElementById('setup');if(f)f.addEventListener('submit',saveSetup);
}

/* ---------- the daily file ---------- */
function fileFor(day){
  var visits=day===S.day?S.visits:S.archive[day].visits;
  var name='fc_visits_'+S.cfg.fc_code+'_T'+S.cfg.tablet+'_'+day+'.csv';
  return new File([C.toCSV(S.cfg,day,visits)],name,{type:'text/csv'});
}
function markSent(day){S.sentAt=S.sentAt||{};S.sentAt[day]=Date.now();persist();}
function send(day){
  var f=fileFor(day);
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:f.name}).then(function(){markSent(day);go('summary');},function(){/* cancelled: nothing sent */});
    return;
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  markSent(day);go('summary',{shareFail:true});
}

/* ---------- set-up ---------- */
function saveSetup(e){
  e.preventDefault();var fd=new FormData(e.target),d=ui.draft;
  d.fc_code=String(fd.get('fc_code')).trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');d.fc_name=String(fd.get('fc_name')).trim();
  d.tablet=Math.min(9,Math.max(1,parseInt(fd.get('tablet'),10)||1));d.pin=String(fd.get('pin'));
  if(!d.fc_code||!d.fc_name)return go('setup',{err:'Enter the FC code and name.'});
  if(!/^\d{4}$/.test(d.pin))return go('setup',{err:'The PIN must be 4 digits.'});
  d.upload_url=String(fd.get('upload_url')||'').trim();
  if(d.upload_url&&!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])/.test(d.upload_url))return go('setup',{err:'The upload address must start with https://'});
  if(S.cfg)return finishSetup(d);
  d.access=String(fd.get('access')||'');
  if(!(window.crypto&&crypto.subtle))return go('setup',{err:'Open the app from its https link to set it up.'});
  crypto.subtle.digest('SHA-256',new TextEncoder().encode('fcvr:'+d.access.toUpperCase().replace(/[^A-Z0-9]/g,''))).then(function(b){
    var h=Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
    if(h!==ACCESS_HASH)return go('setup',{err:'Wrong access code. Ask ISU for it.'});
    delete d.access;finishSetup(d);});
}
function finishSetup(d){
  S.cfg=d;ui.draft=null;persist();countPending();upload();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  go('home');
}

/* ---------- actions ---------- */
function newVisit(type,no){var v;write(function(){v=C.arrive(S,type,no,Date.now());});go('doneArr',{no:v.no});}
function closeVisit(v,outcome,detail){
  var x;write(function(){x=C.leave(S,v&&live(v),outcome,detail,Date.now());});
  go('doneExit',{msg:x.no!=null?t('done_exit',{n:x.no}):t('done_exit_nm'),sub:x.arr?t('time_fc',{d:dur(x.exit-x.arr)}):''});
}
var act={
 go:function(v){go(v);},
 goKeep:function(v){go(v,{v:ui.ctx.v});},
 lang:function(){S.cfg.lang=lang()==='en'?'ur':'en';persist();render();},
 arrive:function(){go('type');},
 leave:function(){go('pad',{mode:'exit',val:''});},
 type:function(k){if(S.cfg.idMode==='card')go('pad',{mode:'card',type:k,val:''});else newVisit(k);},
 returnNo:function(){go('pad',{mode:'returnNo',val:''});},
 key:function(k){var c=ui.ctx,max=ui.screen==='pin'?4:3;c.bad=false;
  if(k==='del')c.val=(c.val||'').slice(0,-1);else if((c.val||'').length<max)c.val=(c.val||'')+k;
  if(ui.screen!=='pin')c.val=c.val.replace(/^0+/,'');render();},
 padok:function(){var c=ui.ctx,n=+c.val;
  if(ui.screen==='pin'){if(c.val===S.cfg.pin){ui.draft=null;return go('setup');}return go('pin',{val:'',bad:true});}
  if(c.mode==='card')return newVisit(c.type,n);
  var v=C.findOpen(S,n);if(!v)return;
  if(c.mode==='returnNo'){write(function(){C.stepIn(live(v));});return go('doneExit',{msg:t('done_back',{n:n})});}
  go(v.status==='out'?'outChoice':'outcome',{v:v});},
 nono:function(){go('outcome',{v:null});},
 tile:function(n){var v=C.findOpen(S,+n);if(v)go(v.status==='out'?'outChoice':'outcome',{v:v});},
 backin:function(){var v=ui.ctx.v;write(function(){C.stepIn(live(v));});go('doneExit',{msg:t('done_back',{n:v.no})});},
 outleave:function(){go('outcome',{v:ui.ctx.v});},
 out:function(k){var v=ui.ctx.v;
  if(k==='yes')return go('service',{v:v});
  if(k==='no')return go('reason',{v:v});
  write(function(){C.stepOut(live(v));});go('doneExit',{msg:t('done_out',{n:v.no})});},
 svc:function(k){closeVisit(ui.ctx.v,'served',k);},
 reason:function(k){closeVisit(ui.ctx.v,'not_served',k);},
 undo:undo,
 closeday:function(){write(function(){C.closeOpen(S,Date.now());});go('summary',{closed:true});upload();},
 upnow:function(){upload(true);render();},
 send:function(d){send(d);},
 settings:function(){go('pin',{val:''});},
 seg:function(v){var p=v.split('|');ui.draft[p[0]]=p[1];
  [].forEach.call(document.querySelectorAll('[data-seg="'+p[0]+'"] button'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===v));});}
};
document.getElementById('app').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var f=act[b.getAttribute('data-act')];if(f)f(b.getAttribute('data-v'));
});

/* ---------- a new day: archive yesterday (open visits become no exit check) ---------- */
function checkDay(){if(C.rollover(S,Date.now())){persist();go('home');}}
setInterval(checkDay,60000);

/* ---------- direct upload (only when an upload address is set): changed rows, one request per day ---------- */
function upload(manual){
  if(!S.cfg||!S.cfg.upload_url||uploading)return;
  if(!navigator.onLine){upErr='offline';if(manual||ui.screen==='summary')render();return;}
  var batches=C.pendingUpload(S);
  if(!batches.length){S.lastUpload=Date.now();upErr=null;persist();countPending();if(ui.screen==='home'||ui.screen==='summary')render();return;}
  uploading=true;
  var chain=Promise.resolve();
  batches.forEach(function(b){chain=chain.then(function(){
    var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort();},30000);
    // text/plain keeps this a simple request (no CORS preflight); the flow parses the JSON
    return fetch(S.cfg.upload_url,{method:'POST',headers:{'Content-Type':'text/plain'},body:C.payload(S,b),signal:ctl.signal}).then(function(r){
      clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);C.markUploaded(S,b);persist();});});});
  chain.then(function(){S.lastUpload=Date.now();upErr=null;},function(e){upErr=e&&e.name==='AbortError'?'timeout':String(e&&e.message||e);})
    .then(function(){uploading=false;persist();countPending();if(ui.screen==='home'||ui.screen==='summary')render();});
}
setInterval(upload,15*60000);
addEventListener('online',function(){upload();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkDay();});
checkDay();
countPending();
render();
upload();

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');
})();
</script>
